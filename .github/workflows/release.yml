name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Run tests
        working-directory: backend
        run: cargo test

      # Signing needs the Developer ID certificate in the repository secrets (see design/signing-setup.md).
      # Without it the build is unsigned (ad-hoc), as before
      - name: Check signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not set. Building an unsigned app"
          fi

      - name: Write the notarization API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build (signed and notarized)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          npx tauri build --target aarch64-apple-darwin
          npx tauri build --target x86_64-apple-darwin

      - name: Verify the signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            app="backend/target/$target/release/bundle/macos/dot.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done

      - name: Build for aarch64 (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: npx tauri build --target aarch64-apple-darwin

      - name: Build for x86_64 (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: npx tauri build --target x86_64-apple-darwin

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backend/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            backend/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
